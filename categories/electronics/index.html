<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronics — XteInk Lover</title>
  <meta name="description" content="Browse pre-loved electronics: phones, earbuds, laptops and more at honest prices.">
  <link rel="icon" href="../../assets/img/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

  <header id="site-header" role="banner"></header>

  <!-- Category Hero -->
  <section class="category-hero" aria-label="Category header">
    <div class="cat-emoji" aria-hidden="true">📱</div>
    <h1>Electronics</h1>
    <p>Quality pre-loved phones, earbuds, laptops, and gadgets.</p>
  </section>

  <!-- Main Layout -->
  <main id="main-content" role="main">

    <!-- Sidebar -->
    <aside id="sidebar" aria-label="Filter products">
      <div class="sidebar-section">
        <div class="sidebar-title">Filter by Condition</div>
        <div class="condition-pills" id="condition-filter">
          <button class="cond-pill active" data-cond="all"    id="cond-all">All</button>
          <button class="cond-pill"        data-cond="Like New" id="cond-like-new">Like New</button>
          <button class="cond-pill"        data-cond="Good"   id="cond-good">Good</button>
          <button class="cond-pill"        data-cond="Fair"   id="cond-fair">Fair</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Price Range</div>
        <div class="price-inputs">
          <input type="number" id="price-min" placeholder="Min $" min="0" aria-label="Minimum price">
          <input type="number" id="price-max" placeholder="Max $" min="0" aria-label="Maximum price">
        </div>
        <button class="filter-btn" id="apply-price-btn">Apply</button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">All Categories</div>
        <ul class="cat-list" id="cat-filter-list" role="list"></ul>
      </div>
    </aside>

    <!-- Products Area -->
    <section id="products-area" aria-label="Electronics listings">
      <div class="area-header">
        <div>
          <span class="area-title">Electronics</span>
          <span class="area-count" id="area-count"></span>
        </div>
        <select class="sort-select" id="sort-select" aria-label="Sort products">
          <option value="featured">Featured First</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="newest">Newest First</option>
        </select>
      </div>
      <div id="product-grid" role="list" aria-live="polite"></div>
    </section>

  </main>

  <footer id="site-footer" role="contentinfo"></footer>
  <div id="global-popup" role="dialog" aria-modal="true"></div>

  <script src="../../assets/js/products.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    const PAGE_CATEGORY = 'electronics'; // ← matches CATEGORIES slug
    let activeCondition = 'all';
    let priceMin = null;
    let priceMax = null;

    document.addEventListener('DOMContentLoaded', () => {
      initPage(PAGE_CATEGORY);
      buildCatSidebar();
      renderProducts();
      setupFilters();
    });

    function buildCatSidebar() {
      const list = document.getElementById('cat-filter-list');
      if (!list) return;
      list.innerHTML = CATEGORIES.filter(c => c.slug !== 'all').map(c => `
        <li class="cat-item ${c.slug === PAGE_CATEGORY ? 'active' : ''}" id="sidebar-cat-${c.slug}" role="listitem">
          <a href="../../categories/${c.slug}/index.html" style="display:flex;align-items:center;justify-content:space-between;width:100%;">
            <span><span class="cat-icon">${c.icon}</span> ${c.label}</span>
          </a>
        </li>`).join('');
    }

    function setupFilters() {
      document.getElementById('apply-price-btn').addEventListener('click', () => {
        priceMin = parseFloat(document.getElementById('price-min').value) || null;
        priceMax = parseFloat(document.getElementById('price-max').value) || null;
        renderProducts();
      });
      document.getElementById('condition-filter').querySelectorAll('.cond-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          activeCondition = pill.dataset.cond;
          document.querySelectorAll('.cond-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          renderProducts();
        });
      });
      document.getElementById('sort-select').addEventListener('change', renderProducts);
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      const countEl = document.getElementById('area-count');
      let list = getProducts(PAGE_CATEGORY);
      if (activeCondition !== 'all') list = list.filter(p => p.condition === activeCondition);
      if (priceMin !== null) list = list.filter(p => p.price >= priceMin);
      if (priceMax !== null) list = list.filter(p => p.price <= priceMax);

      const sort = document.getElementById('sort-select').value;
      if (sort === 'price-asc')  list.sort((a, b) => a.price - b.price);
      if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
      if (sort === 'newest')     list.sort((a, b) => new Date(b.date) - new Date(a.date));
      if (sort === 'featured')   list.sort((a, b) => (b.featured?1:0) - (a.featured?1:0));

      if (countEl) countEl.textContent = `${list.length} item${list.length !== 1 ? 's' : ''}`;

      grid.innerHTML = list.length === 0
        ? `<div class="empty-state"><div class="empty-icon">📭</div><h3>No items</h3><p>Check back soon!</p></div>`
        : list.map(p => buildProductCard(p, '../../')).join('');
    }
  </script>
</body>
</html>
